name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest==8.3.5 PyYAML==6.0.2 ruff==0.11.2

      - name: Lint Python
        run: ruff check custom_components tests

      - name: Run tests
        run: pytest -q
